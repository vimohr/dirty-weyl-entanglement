name: Validate generators
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.14"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Eigen and build tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libeigen3-dev
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Configure backend
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compile backend
        run: cmake --build build --parallel 2
      - name: Numerical and HDF5 checks
        run: python -m unittest discover -s tests -v
      - name: Install command-line entry points
        run: python -m pip install -e .
      - name: Check installed commands outside the repository
        working-directory: /tmp
        run: |
          entanglement-clean --help
          entanglement-ensemble --help
          entanglement-extract --help
          entanglement-verify --help
