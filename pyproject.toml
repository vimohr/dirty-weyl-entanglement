[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wsm-entanglement-data"
version = "0.1.0"
description = "Generation and provenance of disordered-semimetal entanglement spectra"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Vinícius Mohr"}]
dependencies = ["numpy>=1.26,<3", "h5py>=3.10,<4"]

[project.urls]
Paper = "https://arxiv.org/abs/2607.26660"
Repository = "https://github.com/vimohr/dirty-weyl-entanglement"
Issues = "https://github.com/vimohr/dirty-weyl-entanglement/issues"

[project.scripts]
entanglement-clean = "generate_clean_spectrum:main"
entanglement-ensemble = "generate_entanglement_ensemble:main"
entanglement-extract = "extract_example_spectra:main"
entanglement-verify = "verify_archived_data:main"

[tool.setuptools]
packages = ["entanglement_data"]
py-modules = ["generate_clean_spectrum", "generate_entanglement_ensemble", "extract_example_spectra", "verify_archived_data"]
